<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneios · StumbleBeast</title>
<style>
  :root { --bg:#0b1b3a; --card:#13294f; --line:#24407a; --txt:#eef3ff; --mut:#9db2dd; --acc:#ffc233; --ok:#35d07f; --bad:#ff5d6c; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--txt); padding:12px; max-width:860px; margin-inline:auto; }
  h1 { font-size:20px; margin:4px 0 12px; } h2 { font-size:16px; margin:0 0 10px; color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 3px; }
  input, select, textarea { width:100%; padding:9px; border-radius:8px; border:1px solid var(--line); background:#0d2147; color:var(--txt); font:inherit; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  button { padding:9px 14px; border:0; border-radius:8px; font:inherit; font-weight:700; background:var(--acc); color:#241a00; cursor:pointer; }
  button.sec { background:#2a4a8a; color:var(--txt); } button.bad { background:var(--bad); color:#fff; } button.ok { background:var(--ok); color:#04230f; }
  button.sm { padding:5px 10px; font-size:13px; }
  .t { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .t:first-of-type { border-top:0; } .mut { color:var(--mut); font-size:13px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:99px; background:#2a4a8a; } .pill.on { background:var(--ok); color:#04230f; } .pill.off { background:#5b3340; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; }
  .round { margin:8px 0 2px; font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
  .m { display:flex; justify-content:space-between; gap:8px; padding:7px 9px; margin:4px 0; background:#0d2147; border-radius:8px; flex-wrap:wrap; }
  .w { color:var(--ok); font-weight:700; } .disp { border:1px solid var(--bad); }
  #msg { position:sticky; top:6px; z-index:5; padding:9px 12px; border-radius:8px; margin-bottom:10px; display:none; font-weight:600; }
  #msg.ok { background:var(--ok); color:#04230f; display:block; } #msg.bad { background:var(--bad); color:#fff; display:block; }
</style>
</head>
<body>
<h1>🏆 Torneios · StumbleBeast</h1>
<div id="msg"></div>

<div class="card" id="login">
  <label>Endereço do servidor</label>
  <input id="base" autocomplete="off" placeholder="https://stumblefast-backend-new.onrender.com">
  <label>Chave de admin (ADMIN_KEY do servidor)</label>
  <div class="row" style="grid-template-columns:1fr auto">
    <input id="key" type="password" autocomplete="off" placeholder="cole a chave">
    <button id="enter">Entrar</button>
  </div>
</div>

<div id="app" hidden>
  <div class="card">
    <h2>Criar torneio</h2>
    <label>Nome</label><input id="f_name" maxlength="40" placeholder="Ex.: Copa SGFast">
    <label>Descrição (opcional)</label><input id="f_desc" maxlength="200">
    <div class="row">
      <div><label>Jogadores</label><select id="f_size"></select></div>
      <div><label>Mapa (level)</label><input id="f_level"></div>
    </div>
    <div class="row">
      <div><label>Taxa de entrada</label><input id="f_cost" type="number" min="0" value="0"></div>
      <div><label>Moeda</label><select id="f_cur"></select></div>
    </div>
    <div class="row3">
      <div><label>Prêmio campeão</label><input id="f_p1" type="number" min="0"></div>
      <div><label>Finalista</label><input id="f_p2" type="number" min="0"></div>
      <div><label>Semifinalistas</label><input id="f_p3" type="number" min="0"></div>
    </div>
    <div style="margin-top:12px"><button id="create">Criar torneio</button></div>
  </div>

  <div class="card"><h2>Torneios</h2><div id="defs"></div></div>
  <div class="card"><h2>Disputas (precisam de decisão)</h2><div id="disputes"></div></div>
  <div class="card"><h2>Brackets</h2><div id="brackets"></div></div>
  <div class="card" id="viewCard" hidden><h2 id="viewTitle">Chaveamento</h2><div id="view"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const RENDER_URL = "https://stumblefast-backend-new.onrender.com";
let KEY = localStorage.getItem("adminKey") || "";
let BASE = localStorage.getItem("adminBase") || (location.protocol.startsWith("http") ? location.origin : RENDER_URL);
$("base").value = BASE;
let openBracket = null, defsById = {};

function say(text, ok) { const m = $("msg"); m.textContent = text; m.className = ok ? "ok" : "bad"; clearTimeout(say.t); say.t = setTimeout(() => (m.className = ""), 4000); }
async function api(path, body) {
  const r = await fetch(BASE + path, { method: body ? "POST" : "GET", headers: { "x-admin-key": KEY, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || ("erro " + r.status));
  return j;
}
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v); }
  kids.flat().forEach((c) => e.append(c));
  return e;
}
const btn = (text, cls, fn) => el("button", { class: "sm " + cls, onclick: fn }, text);
const act = (fn) => async () => { try { await fn(); await load(); } catch (e) { say(e.message, false); } };

async function load() {
  if (!KEY) return;
  let d;
  try { d = await api("/admin/bracket/list"); } catch (e) { $("app").hidden = true; $("login").hidden = false; say(e.message, false); return; }
  $("login").hidden = true; $("app").hidden = false;
  if (!$("f_size").options.length) {
    d.options.sizes.forEach((s) => $("f_size").append(el("option", { value: s }, s + " jogadores")));
    $("f_size").value = 8;
    d.options.currencies.forEach((c) => $("f_cur").append(el("option", { value: c }, c)));
    $("f_level").value = d.options.defaultLevel;
    $("f_p1").value = d.options.defaultPrizes.champion; $("f_p2").value = d.options.defaultPrizes.finalist; $("f_p3").value = d.options.defaultPrizes.semifinalist;
  }
  defsById = Object.fromEntries(d.defs.map((x) => [x.id, x]));

  $("defs").replaceChildren(...(d.defs.length ? d.defs.map((t) => el("div", { class: "t" },
    el("div", {}, el("b", {}, `#${t.id} ${t.name} `), el("span", { class: "pill " + (t.enabled ? "on" : "off") }, t.enabled ? "ativo" : "desligado"),
      el("div", { class: "mut" }, `${t.size} jogadores · entrada ${t.entryCurrencyCost} ${t.entryCurrencyType} · prêmios ${t.prizes.champion}/${t.prizes.finalist}/${t.prizes.semifinalist}`)),
    el("div", { class: "btns" },
      btn(t.enabled ? "Desligar" : "Ligar", "sec", act(() => api("/admin/bracket/toggle", { id: t.id, enabled: !t.enabled }))),
      btn("Excluir", "bad", act(async () => { if (confirm("Excluir " + t.name + "?")) await api("/admin/bracket/delete", { id: t.id }); }))))
  ) : [el("div", { class: "mut" }, "Nenhum torneio criado ainda.")]));

  $("disputes").replaceChildren(...(d.disputes.length ? d.disputes.map((m) => el("div", { class: "t" },
    el("div", {}, el("b", {}, `${m.a.username} x ${m.b.username}`), el("div", { class: "mut" }, m.reason || "disputa")),
    el("div", { class: "btns" },
      btn(m.a.username + " venceu", "ok", act(() => api("/admin/bracket/resolve", { matchId: m.matchId, winnerStumbleId: m.a.stumbleId }))),
      btn(m.b.username + " venceu", "ok", act(() => api("/admin/bracket/resolve", { matchId: m.matchId, winnerStumbleId: m.b.stumbleId }))))
  )) : [el("div", { class: "mut" }, "Nenhuma disputa.")]));

  const rows = [...d.active, ...d.recent];
  $("brackets").replaceChildren(...(rows.length ? rows.map((b) => el("div", { class: "t" },
    el("div", {}, el("b", {}, (defsById[b.tournamentId] ? defsById[b.tournamentId].name : "#" + b.tournamentId)), el("span", { class: "pill" }, " " + b.status),
      el("div", { class: "mut" }, b.status === "registering" ? `${b.players}/${b.size} inscritos` : b.status === "finished" ? `campeão: ${b.champion}` : "em andamento")),
    btn("Ver", "sec", () => { openBracket = b.bracketId; showBracket(); }))
  ) : [el("div", { class: "mut" }, "Nenhum bracket ainda.")]));
  if (openBracket) showBracket();
}

async function showBracket() {
  try {
    const b = await api("/admin/bracket/view/" + openBracket);
    $("viewCard").hidden = false;
    $("viewTitle").textContent = "Chaveamento · " + b.status;
    const nodes = [];
    if (b.status === "registering") nodes.push(el("div", { class: "mut" }, "Inscritos: " + b.players.map((p) => p.username).join(", ")));
    let cur = 0;
    [...b.matches].sort((x, y) => x.round - y.round || x.slot - y.slot).forEach((m) => {
      if (m.round !== cur) { cur = m.round; nodes.push(el("div", { class: "round" }, "Rodada " + cur)); }
      const nm = (s) => el("span", { class: m.winner === s.stumbleId ? "w" : "" }, s.username + (m.winner === s.stumbleId ? " ✓" : ""));
      nodes.push(el("div", { class: "m" + (m.status === "disputed" ? " disp" : "") }, el("span", {}, nm(m.a), " x ", nm(m.b)), el("span", { class: "mut" }, m.status === "ready" ? "jogando" : m.status === "disputed" ? "⚠ disputa" : (m.reason || ""))));
    });
    $("view").replaceChildren(...nodes);
  } catch (e) { say(e.message, false); }
}

$("enter").onclick = () => {
  KEY = $("key").value.trim(); BASE = ($("base").value.trim() || RENDER_URL).replace(/\/+$/, "");
  localStorage.setItem("adminKey", KEY); localStorage.setItem("adminBase", BASE); load();
};
$("create").onclick = act(async () => {
  const num = (id) => Number($(id).value || 0);
  await api("/admin/bracket/create", {
    name: $("f_name").value, description: $("f_desc").value, size: num("f_size"), level: $("f_level").value,
    entryCurrencyType: $("f_cur").value, entryCurrencyCost: num("f_cost"),
    prizes: { champion: num("f_p1"), finalist: num("f_p2"), semifinalist: num("f_p3") },
  });
  $("f_name").value = ""; $("f_desc").value = "";
  say("Torneio criado!", true);
});
load(); setInterval(load, 10000);
</script>
</body>
</html>
